name: Skrillex R51 Switch build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run built-in regressions
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror source/main.c -o skrillex-host
          ./skrillex-host
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/regression.c -o skrillex-regression
          ./skrillex-regression
      - name: Sanitizer regression
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all source/main.c -o skrillex-sanitize
          ./skrillex-sanitize
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all tests/regression.c -o skrillex-regression-sanitize
          ./skrillex-regression-sanitize
  build:
    needs: host-regression
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native NRO
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64="$DEVKITPRO/devkitA64"
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          aarch64-none-elf-gcc -O2 -Wall -Wextra -D__SWITCH__ -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE -ffunction-sections -fdata-sections -I"$DEVKITPRO/libnx/include" -L"$DEVKITPRO/libnx/lib" -specs="$DEVKITPRO/libnx/switch.specs" source/main.c -Wl,--gc-sections -lnx -o Skrillex-R51.elf
          nacptool --create Skrillex InfraCare 0.51.0 Skrillex-R51.nacp
          elf2nro Skrillex-R51.elf Skrillex-R51.nro --nacp=Skrillex-R51.nacp --icon="$DEVKITPRO/libnx/default_icon.jpg"
          test "$(dd if=Skrillex-R51.nro bs=1 skip=16 count=4 2>/dev/null)" = NRO0
          sha256sum Skrillex-R51.nro > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Skrillex-R51-Switch
          path: |
            Skrillex-R51.nro
            SHA256SUMS
          if-no-files-found: error
